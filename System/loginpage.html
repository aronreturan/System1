<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="login-container">
    <div class="login-header">
      <h2>Admin Login</h2>
      <p>Enter your credentials to access the system</p>
    </div>

    <form class="login-form">
      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="username" placeholder="Enter username" maxlength="20" required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Enter password" maxlength="20" required>
        </div>
      </div>

      <button type="submit" class="sign-in-btn">Sign In</button>
    </form>

    <div class="login-footer">
      <p>Demo credentials:</p>
      <p>Username: <strong>admin</strong> | Password: <strong>admin123</strong></p>
    </div>
  </div>

  <script>
    const loginForm = document.querySelector('.login-form');

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username.length > 30 ) {
        alert('Username cannot be more than 30 characters');
        return;
      }

      if (password.length > 20) {
        alert('Password cannot be more than 20 characters');
        return;
      }


      if (username === 'admin' && password === 'admin123') {

        window.location.href = 'homepage.html';
      } else {
        alert('Invalid credentials. Please try again!');
      }
    });
  </script>
</body>

</html>
