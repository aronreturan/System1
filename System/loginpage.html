<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="login-container">
    <div class="login-header">
      <h2>BSHM Monitoring System</h2>
      <p>Select your role to access the system</p>
    </div>

  <div class="role-selection">
    <button class="admin-btn">Admin</button>
    <button class="teacher-btn">Instructor</button>
    <button class="student-btn">Student</button>
  </div>

    <form class="login-form">
      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="username" placeholder="Enter username" maxlength="20" required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Enter password" maxlength="20" required>
        </div>
      </div>

      <button type="submit" class="sign-in-btn">Sign In</button>
    </form>

    <div class="login-footer">
      <p>Demo credentials:</p>
      <p>Username: <strong>admin</strong> | Password: <strong>admin123</strong></p>
    </div>
  </div>

    <script>
      const loginForm = document.querySelector('.login-form');
      const roleButtons = document.querySelectorAll('.role-selection button');
      const signInBtn = document.querySelector('.sign-in-btn');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const demoUserLabel = document.querySelector('.login-footer strong:nth-of-type(1)');
      const demoPassLabel = document.querySelector('.login-footer strong:nth-of-type(2)');

      roleButtons.forEach(button => {
        button.addEventListener('click', () => {
          roleButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');

          const role = button.innerText;
          signInBtn.innerText = `Sign In as ${role}`;
          usernameInput.placeholder = `Enter ${role.toLowerCase()} username`;
          passwordInput.placeholder = `Enter ${role.toLowerCase()} password`;
          const roleLower = role.toLowerCase();
        demoUserLabel.innerText = roleLower;
        demoPassLabel.innerText = roleLower + '123';
      });
    });
    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const username = usernameInput.value;
      const password = passwordInput.value;
      const activeRole = document.querySelector('.role-selection button.active').innerText.toLowerCase();

      if (username.length > 30) {
        alert('Username cannot be more than 30 characters');
        return;
      }

      if (password.length > 20) {
        alert('Password cannot be more than 20 characters');
        return;
      }

      if (username === activeRole && password === activeRole + '123') {
        window.location.href = 'homepage.html';
      } else {
        alert(`Invalid ${activeRole} credentials. Please try again!`);
      }
    });
    </script>
    
  </body>

</html>
